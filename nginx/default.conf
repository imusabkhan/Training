server {
    listen 80;
    server_name _;

    # Main file-inclusion CTF app
    location / {
        proxy_pass http://file-inclusion-ctf:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Internal microservice (LFI lab)
    location /internal {
        proxy_pass http://lfi-lab-microservice:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
