server {
    listen 80;
    server_name _;

    # --- Front door: the vulnerable login page (Challenge 0, SQLi auth bypass) ---
    location = / {
        proxy_pass http://login-app:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- File Inclusion challenges (Java Spring Boot app) ---
    location /dr-strange      { proxy_pass http://file-inclusion-ctf:8080; }
    location /deadpool        { proxy_pass http://file-inclusion-ctf:8080; }
    location /captain-america { proxy_pass http://file-inclusion-ctf:8080; }
    location /goku            { proxy_pass http://file-inclusion-ctf:8080; }
    location /hints           { proxy_pass http://file-inclusion-ctf:8080; }

    # Challenge index page (the Java app's own landing page at its root)
    location = /challenges {
        proxy_pass http://file-inclusion-ctf:8080/;
        proxy_set_header Host $host;
    }

    # Internal microservice (LFI lab)
    location /internal {
        proxy_pass http://lfi-lab-microservice:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else falls through to the login app.
    location / {
        proxy_pass http://login-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
